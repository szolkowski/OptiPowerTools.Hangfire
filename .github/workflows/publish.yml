name: Publish NuGet

on:
  push:
    tags: ['v2.*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/OptiPowerTools.Hangfire/OptiPowerTools.Hangfire.csproj -c Release -o ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/szolkowski/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" == *"-beta"* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            ./nupkg/*.nupkg \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
