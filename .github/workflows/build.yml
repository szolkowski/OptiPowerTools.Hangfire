name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/OptiPowerTools.Hangfire/OptiPowerTools.Hangfire.csproj

      - name: Build
        run: dotnet build src/OptiPowerTools.Hangfire/OptiPowerTools.Hangfire.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/OptiPowerTools.Hangfire.Tests/OptiPowerTools.Hangfire.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack src/OptiPowerTools.Hangfire/OptiPowerTools.Hangfire.csproj --no-build -c Release
